<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Formulir Registrasi Data Mahasiswa</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</head>

<body>
    <h1>Registrasi Data Mahasiswa</h1>
    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpadding="4" border="1">
            <tr>
                <td>
                    <label for="namamhs"><strong>Nama Lengkap</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="namamhs" name="namamhs" size="30" placeholder="ex:Joko Subianto" />
                </td>
            </tr>

            <tr>
                <td>
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-Laki"/><label for="laki">Laki-Laki</label>
                    <input type="radio" id="Perempuan" name="jk" value="Perempuan"/><label for="Perempuan">Perempuan</label>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="prodi"><strong>Program Studi</strong>
                    </label>
                </td>
                <td>
                    <select name="prodi" id="prodi">
                        <option>Informatika</option>
                        <option>Sistem Infromasi</option>
                        <option>Teknik Industri</option>
                        <option>Ilmu Komunikasi</option>
                        <option>Sosiologi</option>
                        <option>Ilmu Politik</option>
                        <option>Akuntansi</option>
                        <option>Manajemen</option>
                        <option>Ekonomi Pembangunan</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="email">
                        <strong>Email</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="email" name="email" size="30" placeholder="email@example.com"/>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="telepon">
                        <strong>Nomor Telepon</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="telepon" name="telepon" size="30" placeholder="ex:0812347299"/>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">
                        <strong>Password</strong>
                    </label>
                </td>
                <td>
                    <input type="password" id="password" name="password" size="30"/>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="photo">
                        <strong>Foto Mahasiswa</strong>
                    </label>
                </td>
                <td>
                    <input type="file" id="photo" size="18" accept="image/gif, image/jpeg, image/png"/>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="namasmu">
                        <strong>Sekolah Asal</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="namasmu" name="namasmu" size="30"/>
                </td>
            </tr>
            <tr>
                <td class="favorit">
                    <strong>Hal Favorit</strong>
                </td>
                <td>
                    <div id="musik">
                        <strong>Musik</strong><br/>
                        <input type="checkbox" id="musik1" name="musik" value="Pop"/>
                        <label for="musik1">Pop</label>
                        <input type="checkbox" id="musik2" name="musik" value="Rock"/>
                        <label for="musik2">Rock</label>
                        <input type="checkbox" id="musik3" name="musik" value="Jazz"/>
                        <label for="musik3">Jazz</label>
                    </div>
                    <div id="film">
                        <strong>Film</strong><br/>
                        <input type="checkbox" id="film1" name="film" value="Drama"/>
                        <label for="film1">Drama</label>
                        <input type="checkbox" id="film2" name="film" value="Action"/>
                        <label for="film2">Action</label>
                        <input type="checkbox" id="film3" name="film" value="Sci-Fi"/>
                        <label for="film3">Sci-Fi</label>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="resume">
                    <label for="resume">
                        <strong>Deskripsi Diri</strong>
                    </label>
                </td>
                <td>
                    <textarea id="resume" name="resume" rows="10" cols="23"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input id="submit" type="submit" name="simpan" value="SUBMIT"/>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
