<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" 
"http://www.w3.org/TR/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title> Form Pendaftaran Ekskul (XHTML)</title>
    <script type="text/javascript">
        function fn_ValForm(){ 
            var sMsg = "";

            if(document.getElementById("nama").value == ""){
                sMsg += "\n* Anda belum mengisikan nama";
            }
            if(document.getElementById("kelas").value == ""){
                sMsg += "\n* Anda belum mengisikan kelas";
            }
            if(document.getElementById("alasan").value == ""){
                sMsg += "\n* Anda belum mengisikan alasan";
            }

            if(sMsg != ""){
                alert("Peringatan:\n" + sMsg);
                return false;
            }else{
                return true;
            }
        }
    </script>
</head>

<body>
    <h1>Form Pendaftaran Ekskul</h1>
    <form action="#" method="post" onsubmit="return fn_ValForm();">
        <p>Nama:<br /><input type="text" name="nama" id="nama"/></p>
        <p>Kelas:<br /><input type="text" name="kelas" id="kelas"/></p>
        <p>Alasan Bergabung:
            <br /><textarea name="asalan" id="alasan" rows="4" cols="30"></textarea>
        </p>
        <p><input type="submit" value="Send"/></p>
    </form>
</body>

</html>
