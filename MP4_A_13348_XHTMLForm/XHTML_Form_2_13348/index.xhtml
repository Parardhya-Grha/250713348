<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Formulir Pendaftaran Seminar</title>
</head>
<body>
    <h1>Formulir Pendaftaran Seminar</h1>
    <form action="" method="post" enctype="multipart/form-data">
        <h2>Data Peserta</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse; width: 100%;">
            <tr>
                <td style="width: 32%;">
                    <label for="nama"><strong>Nama Lengkap</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="nama" name="nama" size="30"/>
                </td>
                
            </tr>

            <tr>
                <td>
                    <label for="nim"><strong>NIM</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" size="30"/>
                </td>
            </tr>

            <tr>
                <td>
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-Laki"/><label for="laki">Laki-Laki</label>
                    <input type="radio" id="Perempuan" name="jk" value="Perempuan"/><label for="Perempuan">Perempuan</label>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="prodi"><strong>Program Studi</strong>
                    </label>
                </td>
                <td>
                    <select name="prodi" id="prodi">
                        <option>Infromatika</option>
                        <option>Sistem Infromasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>
        
        <h2>Pilihan Seminar</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse; width: 100%;">
            <tr>
                <td style="width: 32%;">
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <select name="tiket" id="tiket">
                        <option>Reguler</option>
                        <option>VIP</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td style="vertical-align: center;">
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="topik1" name="topik" value="Web Development"/>
                        <label for="topik1">Web Development</label><br/><br/>
                        <input type="checkbox" id="topik2" name="topik" value="Data Science"/>
                        <label for="topik2">Data Science</label><br /><br/>
                        <input type="checkbox" id="topik3" name="topik" value="Artificial Intelligence"/>
                        <label for="topik3">Artificial Intelligence</label><br />
                    </p>
                </td>
            </tr>
        </table>

        <h2>Infromasi Tambahan</h2>
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse: collapse; width: 100%;">
            <tr>
                <td style="vertical-align: center; width: 30%;">
                    <label for="alasan">
                        <strong>Alasan Mengikuti Seminar</strong>
                    </label>
                </td>
                <td>
                    <textarea name="alasan" id="alasan" rows="10" cols="23"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="foto">
                        <strong>Bukti Pembayaran</strong>
                    </label>
                </td>
                <td>
                    <input type="file" id="foto" size="18" accept="image/gif, image/jpeg, image/png"/>
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="submit" name="simpan" value="simpan"/>
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
